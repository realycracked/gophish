<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Échecs · Vél·Tube</title>
<meta name="theme-color" content="#0d0e1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/__vt/chess.css">
<link rel="stylesheet" href="/__vt/chess-pieces.css">
<script src="/__vt/theme.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="/__vt/" aria-label="Accueil">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1>Échecs</h1>
    <span class="code-chip" id="code-chip" hidden></span>
  </header>

  <!-- Accueil des échecs -->
  <section class="lobby" id="lobby">
    <button class="big primary" id="create" type="button">
      <strong>Créer une partie</strong><span>Tu reçois un code à donner à ton ami</span>
    </button>
    <form class="join" id="join" autocomplete="off">
      <input id="join-code" maxlength="5" placeholder="CODE" aria-label="Code de la partie" autocapitalize="characters" spellcheck="false">
      <button type="submit">Rejoindre</button>
    </form>
    <div class="err" id="lobby-err"></div>
    <button class="big" id="local" type="button">
      <strong>À deux sur cet écran</strong><span>Chacun joue à son tour sur le même appareil</span>
    </button>
  </section>

  <!-- Partie -->
  <section class="game" id="game" hidden>
    <div class="player" id="p-top"><span class="dot"></span><span class="name"></span><span class="cap" id="cap-top"></span></div>
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Échiquier"></div>
      <div class="promo" id="promo" hidden></div>
    </div>
    <div class="player" id="p-bot"><span class="dot"></span><span class="name"></span><span class="cap" id="cap-bot"></span></div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="share" id="share" hidden>
      <div>Donne ce code à ton ami :</div>
      <div class="big-code" id="big-code"></div>
      <button type="button" id="share-btn">Partager le lien</button>
    </div>

    <div class="actions">
      <button type="button" id="rematch" hidden>Revanche</button>
      <button type="button" id="undo" hidden>Annuler le coup</button>
      <button type="button" id="resign" class="ghost">Abandonner</button>
      <button type="button" id="leave" class="ghost">Quitter</button>
    </div>
    <ol class="moves" id="moves"></ol>
  </section>
  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="/__vt/chess.js"></script>
</body>
</html>
