<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Échecs · Vél·Tube</title>
<meta name="theme-color" content="#16151c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/__vt/chess.css">
<link rel="stylesheet" href="/__vt/chess-pieces.css">
</head>
<body>
<header class="top">
  <button class="iconbtn" id="back" type="button" aria-label="Retour">
    <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 id="title">Échecs</h1>
  <span class="online" id="online" hidden></span>
  <button class="code-chip" id="code-chip" type="button" hidden></button>
  <button class="iconbtn" id="settings-btn" type="button" aria-label="Réglages">
    <svg width="21" height="21" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
</header>

<!-- ======================= Accueil des échecs ======================= -->
<main class="lobby" id="lobby">
  <section class="me">
    <div class="avatar big-av" id="me-avatar">?</div>
    <div class="me-info">
      <button class="me-name" id="me-name" type="button" title="Changer de pseudo">…</button>
      <div class="me-stats" id="me-stats"></div>
    </div>
    <div class="me-elo"><strong id="me-elo">—</strong><span>Elo</span></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" data-tab="play" class="on" role="tab">Jouer</button>
    <button type="button" data-tab="friends" role="tab">Amis</button>
    <button type="button" data-tab="top" role="tab">Classement</button>
  </nav>

  <section class="panel" data-panel="play">
    <div class="tc-group"><div class="tc-cat"><span class="tc-ic bolt"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg></span>Bullet</div>
      <div class="tcs"><button type="button" data-tc="1+0">1 min</button></div></div>
    <div class="tc-group"><div class="tc-cat"><span class="tc-ic fire"><svg viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-5-4-6-4-11-3 2-5 5-5 8-1-1-2-2-2-4-2 2-3 4-3 7 0 4 3 7 7 7z" fill="currentColor"/></svg></span>Blitz</div>
      <div class="tcs"><button type="button" data-tc="3+0">3 min</button><button type="button" data-tc="3+2">3 | 2</button><button type="button" data-tc="5+0">5 min</button></div></div>
    <div class="tc-group"><div class="tc-cat"><span class="tc-ic rapid"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 9v4l3 2M9 2h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span>Rapide</div>
      <div class="tcs"><button type="button" data-tc="10+0">10 min</button><button type="button" data-tc="15+10">15 | 10</button></div></div>
    <button class="play" id="play" type="button">Jouer</button>
    <p class="hint-txt">Partie classée : ton Elo monte ou descend selon le résultat.</p>
  </section>

  <section class="panel" data-panel="friends" hidden>
    <button class="card-btn" id="create" type="button">
      <span class="cb-ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span><strong>Défier un ami</strong><small>Tu reçois un code à lui donner · non classé</small></span>
    </button>
    <label class="switch-row"><input type="checkbox" id="nolimit"><span>Sans pendule</span><em id="friend-tc"></em></label>
    <form class="join" id="join" autocomplete="off">
      <input id="join-code" maxlength="5" placeholder="CODE" aria-label="Code de la partie" autocapitalize="characters" spellcheck="false">
      <button type="submit">Rejoindre</button>
    </form>
    <div class="err" id="lobby-err"></div>
    <button class="card-btn" id="local" type="button">
      <span class="cb-ic"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span><strong>À deux sur cet écran</strong><small>Chacun joue à son tour sur le même appareil</small></span>
    </button>
  </section>

  <section class="panel" data-panel="top" hidden>
    <ol class="top20" id="top20"><li class="muted">Chargement…</li></ol>
  </section>
</main>

<!-- ======================= Partie ======================= -->
<main class="game" id="game" hidden>
  <div class="g-main">
    <div class="player" id="p-top">
      <div class="avatar" data-av></div>
      <div class="who"><div class="line1"><span class="name"></span><span class="elo"></span><span class="dot"></span></div><div class="cap" id="cap-top"></div></div>
      <div class="clock" id="clk-top"></div>
    </div>
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Échiquier"></div>
      <div class="promo" id="promo" hidden></div>
      <div class="banner" id="banner" hidden></div>
    </div>
    <div class="player" id="p-bot">
      <div class="avatar" data-av></div>
      <div class="who"><div class="line1"><span class="name"></span><span class="elo"></span><span class="dot"></span></div><div class="cap" id="cap-bot"></div></div>
      <div class="clock" id="clk-bot"></div>
    </div>
  </div>

  <aside class="g-side">
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="share" id="share" hidden>
      <div>Donne ce code à ton ami :</div>
      <div class="big-code" id="big-code"></div>
      <button type="button" id="share-btn">Partager le lien</button>
    </div>
    <ol class="moves" id="moves"></ol>
    <div class="toolbar">
      <button type="button" id="draw"><svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">½</text></svg><span>Nulle</span></button>
      <button type="button" id="resign"><svg viewBox="0 0 24 24"><path d="M6 21V4m0 0h10l-2 4 2 4H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span id="resign-lbl">Abandon</span></button>
      <button type="button" id="undo" hidden><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Annuler</span></button>
      <button type="button" id="flip"><svg viewBox="0 0 24 24"><path d="M7 4v16m0 0l-3-3m3 3l3-3M17 20V4m0 0l-3 3m3-3l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Tourner</span></button>
      <button type="button" id="prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Préc.</span></button>
      <button type="button" id="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Suiv.</span></button>
    </div>
  </aside>
</main>

<!-- Recherche d'adversaire -->
<div class="overlay" id="seeking" hidden>
  <div class="sheet-card">
    <div class="radar"><span></span><span></span><div class="pc wn"></div></div>
    <div class="seek-title">Recherche d'un adversaire…</div>
    <div class="seek-sub" id="seek-sub"></div>
    <div class="seek-time" id="seek-time">0:00</div>
    <button type="button" class="ghost-btn" id="seek-cancel">Annuler</button>
  </div>
</div>

<!-- Fin de partie -->
<div class="overlay" id="end" hidden>
  <div class="sheet-card end-card">
    <div class="end-trophy" id="end-icon"></div>
    <div class="end-title" id="end-title"></div>
    <div class="end-reason" id="end-reason"></div>
    <div class="end-vs" id="end-vs"></div>
    <div class="end-elo" id="end-elo"></div>
    <div class="end-btns">
      <button type="button" class="green-btn" id="end-again">Nouvelle partie</button>
      <button type="button" class="green-btn" id="end-rematch">Revanche</button>
      <div class="end-row">
        <button type="button" class="ghost-btn" id="end-view">Revoir la partie</button>
        <button type="button" class="ghost-btn" id="end-lobby">Accueil</button>
      </div>
    </div>
  </div>
</div>

<!-- Réglages -->
<div class="overlay" id="settings" hidden>
  <div class="sheet-card settings-card">
    <div class="set-title">Réglages</div>
    <div class="set-label">Plateau</div>
    <div class="themes" id="themes"></div>
    <label class="switch-row"><input type="checkbox" id="opt-sound"><span>Sons</span></label>
    <label class="switch-row"><input type="checkbox" id="opt-coords"><span>Coordonnées</span></label>
    <label class="switch-row"><input type="checkbox" id="opt-hints"><span>Montrer les coups possibles</span></label>
    <button type="button" class="green-btn" id="settings-close">OK</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="/__vt/chess.js"></script>
</body>
</html>
