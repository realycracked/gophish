<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vél·Tube</title>
<meta name="description" content="Regarde YouTube à pleine vitesse, et ouvre n'importe quel site.">
<meta name="theme-color" content="#0d0e1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/__vt/home.css">
<script src="/__vt/theme.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2338e8ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230b0b14'/%3E%3Cpath d='M8 9l8 16 8-16' fill='none' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="screen" id="screen">
  <button class="done" id="done" type="button">OK</button>

  <header class="clock">
    <div class="t" id="clk">--:--</div>
    <div class="d" id="date"></div>
  </header>

  <form class="search" id="search" autocomplete="off" role="search">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="text" enterkeyhint="search" aria-label="Recherche">
    <div class="seg" role="group" aria-label="Où chercher">
      <button type="button" data-m="yt">YouTube</button>
      <button type="button" data-m="web">Web</button>
    </div>
  </form>

  <main class="grid" id="grid" aria-label="Tes applis"></main>

  <nav class="dock" aria-label="Raccourcis">
    <a class="app" href="/__vt/youtube" title="Lecteur YouTube"><span class="ico ico-yt"></span></a>
    <a class="app" href="/__vt/youtube?view=fav" title="Favoris"><span class="ico c5"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="#fff"/></svg></span></a>
    <a class="app" href="/__vt/youtube?view=hist" title="Reprendre"><span class="ico c4"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M12 8v4l3 2" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></span></a>
    <button class="app" id="theme-btn" type="button" title="Changer de thème"><span class="ico c6"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="#fff"/></svg></span></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="veil" id="veil"></div>
  <form class="sheet" id="sheet" autocomplete="off" aria-label="Ajouter un raccourci">
    <div class="grab"></div>
    <h2>Ajouter un raccourci</h2>
    <div class="prev"><span class="ico" id="pv"></span><div><div id="pvn" class="pvn">Nouveau site</div><div class="muted">Aperçu de l'icône</div></div></div>
    <input id="au" type="text" inputmode="url" placeholder="Adresse (ex. twitch.tv)" aria-label="Adresse du site">
    <input id="an" type="text" maxlength="20" placeholder="Nom (facultatif)" aria-label="Nom du site">
    <div class="err" id="err"></div>
    <button class="ok" type="submit">Ajouter à l'écran</button>
  </form>
</div>
<script src="/__vt/app.js"></script>
</body>
</html>
