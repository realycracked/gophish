<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vél·Tube</title>
<meta name="description" content="Recherche YouTube rapide, lecture directe sans passer par le proxy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b14'/%3E%3Cpath d='M8 9l8 16 8-16' fill='none' stroke='%2338e8ff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  .yt-main { max-width: 1040px; margin: 0 auto;
    padding: 24px max(16px, env(safe-area-inset-right,0px)) 60px max(16px, env(safe-area-inset-left,0px)); }
  .yt-search { display: flex; gap: 10px; background: var(--glass-2); border: 1px solid var(--line);
    border-radius: 16px; padding: 7px 7px 7px 16px; max-width: 680px; margin: 10px auto 6px;
    backdrop-filter: blur(14px); align-items: center; }
  .yt-search:focus-within { border-color: color-mix(in srgb, var(--violet) 70%, transparent); box-shadow: var(--neon); }
  .yt-search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: var(--fg); font: inherit; font-size: 1.05rem; padding: 10px 0; }
  .yt-search .go { flex: none; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--violet), #3f8bff); border: 0; border-radius: 12px; padding: 11px 20px; }
  .hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 0 0 22px; }

  .player-wrap { max-width: 920px; margin: 0 auto 26px; display: none; }
  .player { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line); background: #000; box-shadow: var(--neon); }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player-title { font-family: var(--font-head); font-weight: 600; margin: 12px 2px 0; font-size: 1.1rem; }
  .player-meta { color: var(--muted); font-size: 0.85rem; margin: 2px 2px 0; }
  .player-meta a { color: var(--cyan); }

  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin-top: 8px; }
  .vid { text-align: left; cursor: pointer; background: var(--glass); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; padding: 0; color: var(--fg); font: inherit;
    transition: transform .16s, border-color .16s, box-shadow .16s; }
  .vid:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--violet) 65%, var(--line)); box-shadow: var(--neon); }
  .vid .thumb { position: relative; aspect-ratio: 16 / 9; background: #11121c; overflow: hidden; }
  .vid .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vid .dur { position: absolute; right: 7px; bottom: 7px; background: rgba(0,0,0,.8); color: #fff;
    font-size: 0.72rem; font-weight: 600; padding: 2px 6px; border-radius: 6px; }
  .vid .info { padding: 11px 12px 14px; }
  .vid .t { font-weight: 600; font-size: 0.92rem; line-height: 1.25; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vid .c { color: var(--muted); font-size: 0.8rem; margin-top: 5px; }
  .status { text-align: center; color: var(--muted); padding: 40px 0; line-height: 1.6; }
  .status button { font: inherit; font-weight: 600; color: var(--cyan); background: none; border: 0; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="/">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#38e8ff"/></linearGradient></defs>
        <path d="M7 8.5l9 17 9-17" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand-name">Vél<i>·</i>Tube</span>
  </a>
  <nav class="quick">
    <a class="qbtn" href="/">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Accueil
    </a>
  </nav>
</header>

<main class="yt-main">
  <form id="yt-form" class="yt-search" autocomplete="off">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:var(--muted);flex:none"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="yt-input" type="text" placeholder="Rechercher une vidéo, ou coller un lien YouTube…" aria-label="Recherche YouTube" autofocus>
    <button type="submit" class="go">Chercher</button>
  </form>
  <p class="hint">La vidéo est lue par le lecteur YouTube officiel : elle arrive directement de Google, donc en pleine vitesse.</p>

  <div class="player-wrap" id="player-wrap">
    <div class="player"><iframe id="player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="player-title" id="player-title"></div>
    <div class="player-meta" id="player-meta"></div>
  </div>

  <div id="results" class="results" aria-live="polite"></div>
  <div id="status" class="status"></div>
</main>

<script src="/youtube.js"></script>
</body>
</html>
