<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vél·Tube</title>
<meta name="description" content="Recherche YouTube rapide, lecture directe sans passer par le proxy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171a22'/%3E%3Cpath d='M8 9l8 16 8-16' fill='none' stroke='%238b7bff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  .yt-main { max-width: 1120px; margin: 0 auto;
    padding: 18px max(16px, env(safe-area-inset-right,0px)) 80px max(16px, env(safe-area-inset-left,0px)); }

  .yt-search { display: flex; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 7px 7px 7px 15px; max-width: 720px; margin: 6px auto 22px;
    align-items: center; position: sticky; top: calc(env(safe-area-inset-top,0px) + 68px); z-index: 15; }
  .yt-search:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--surface-2); }
  .yt-search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: var(--fg); font: inherit; font-size: 1.05rem; padding: 10px 0; }
  .yt-search .go { flex: none; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: var(--accent); border: 0; border-radius: 11px; padding: 11px 20px; }
  .yt-search .go:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }

  /* Lecteur */
  .stage { display: none; margin: 0 auto 26px; max-width: 960px; }
  .stage.on { display: block; }
  body.theater .stage { max-width: 1120px; }
  .player-box { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: 16px; overflow: hidden;
    background: #000; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .player-box #player, .player-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 2px 0; }
  .cbtn { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: .85rem; font-weight: 600;
    color: var(--fg); background: var(--surface); border: 1px solid var(--line); cursor: pointer;
    padding: 9px 13px; border-radius: 10px; transition: background .15s, border-color .15s; text-decoration: none; }
  .cbtn:hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--fg) 18%, var(--line)); }
  .cbtn:disabled { opacity: .4; cursor: default; }
  .cbtn svg { color: var(--muted); }
  .cbtn.primary { color: #fff; background: var(--accent); border-color: transparent; }
  .cbtn.primary svg { color: #fff; }
  .cbtn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .cbtn.active { border-color: var(--accent); color: var(--fg); }
  .ctrl .spacer { margin-left: auto; }
  .ctrl .pos { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }

  .player-title { font-family: var(--font-head); font-weight: 600; margin: 14px 2px 0; font-size: 1.2rem; text-wrap: balance; }
  .player-meta { color: var(--muted); font-size: 0.88rem; margin: 3px 2px 0; }

  /* Mode musique : le lecteur se réduit en bas, la liste reste pleine largeur */
  body.music .stage.on { position: fixed; z-index: 40; right: 16px; bottom: 16px; left: auto; margin: 0;
    width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.85); }
  body.music .player-box { border-radius: 10px; box-shadow: none; }
  body.music .player-title { font-size: .95rem; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  body.music .player-meta { font-size: .8rem; }
  body.music .ctrl { margin-top: 10px; gap: 6px; }
  body.music .ctrl .c-opt { display: none; }      /* cache cinéma/plein écran/lien en mini */
  body.music .cbtn { padding: 8px 10px; font-size: .8rem; }

  .list-head { display: flex; align-items: baseline; gap: 12px; margin: 2px 2px 14px; }
  .list-head h2 { font-family: var(--font-head); font-size: 1.15rem; font-weight: 600; margin: 0; }
  .list-head button { font: inherit; font-size: .82rem; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; margin-left: auto; }

  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .vid { text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line);
    border-radius: 13px; overflow: hidden; padding: 0; color: var(--fg); font: inherit;
    transition: background .15s, border-color .15s, transform .15s; }
  .vid:hover { background: var(--surface-2); transform: translateY(-2px); border-color: color-mix(in srgb, var(--fg) 16%, var(--line)); }
  .vid.playing { border-color: var(--accent); }
  .vid .thumb { position: relative; aspect-ratio: 16 / 9; background: #11131a; overflow: hidden; }
  .vid .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vid .play-ov { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .15s; background: rgba(0,0,0,.25); }
  .vid:hover .play-ov { opacity: 1; }
  .vid .play-ov span { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); }
  .vid .dur { position: absolute; right: 7px; bottom: 7px; background: rgba(0,0,0,.82); color: #fff;
    font-size: 0.72rem; font-weight: 600; padding: 2px 6px; border-radius: 6px; }
  .vid .info { padding: 11px 12px 13px; }
  .vid .t { font-weight: 600; font-size: 0.92rem; line-height: 1.3; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vid .c { color: var(--muted); font-size: 0.8rem; margin-top: 5px; }
  .status { text-align: center; color: var(--muted); padding: 40px 0; line-height: 1.6; }
  .status button { font: inherit; font-weight: 600; color: var(--fg); background: none; border: 0; cursor: pointer; text-decoration: underline; }

  @media (max-width: 520px) { .yt-search { position: static; } }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="/">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="30" height="30"><path d="M7 8.5l9 17 9-17" fill="none" stroke="#8b7bff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="brand-name">Vél<i>·</i>Tube</span>
  </a>
  <nav class="quick">
    <a class="qbtn" href="/">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Accueil
    </a>
  </nav>
</header>

<main class="yt-main">
  <form id="yt-form" class="yt-search" autocomplete="off">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:var(--muted);flex:none"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="yt-input" type="text" placeholder="Rechercher une vidéo, ou coller un lien YouTube…" aria-label="Recherche YouTube" autofocus>
    <button type="submit" class="go">Chercher</button>
  </form>

  <section class="stage" id="stage">
    <div class="player-box"><div id="player"></div></div>
    <div class="ctrl">
      <button class="cbtn" id="prev" title="Précédent"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M18 6v12M16 12L8 6v12z" fill="currentColor"/></svg>Précédent</button>
      <button class="cbtn primary" id="next" title="Suivant"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M6 6v12M8 12l8-6v12z" fill="currentColor"/></svg>Suivant</button>
      <span class="pos" id="pos"></span>
      <span class="spacer"></span>
      <button class="cbtn" id="music" title="Mode musique (audio en fond)"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="18" r="2" fill="currentColor"/><circle cx="17" cy="16" r="2" fill="currentColor"/></svg>Musique</button>
      <button class="cbtn c-opt" id="theater" title="Mode cinéma"><svg viewBox="0 0 24 24" width="17" height="17"><rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Cinéma</button>
      <button class="cbtn c-opt" id="full" title="Plein écran"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Plein écran</button>
      <button class="cbtn c-opt" id="copy" title="Copier le lien"><svg viewBox="0 0 24 24" width="17" height="17"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5a2 2 0 0 1 2-2h8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Lien</button>
      <a class="cbtn c-opt" id="openyt" target="_blank" rel="noopener" title="Ouvrir sur YouTube"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M14 4h6v6M20 4l-9 9M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>YouTube</a>
    </div>
    <div class="player-title" id="player-title"></div>
    <div class="player-meta" id="player-meta"></div>
  </section>

  <div class="list-head" id="list-head" hidden><h2 id="list-title"></h2><button id="list-action"></button></div>
  <div id="results" class="results" aria-live="polite"></div>
  <div id="status" class="status"></div>
</main>

<script src="/youtube.js"></script>
</body>
</html>
