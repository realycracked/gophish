name = "gophish"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Interface statique (public/) servie directement par le réseau edge de Cloudflare.
# Les chemins qui ne correspondent à aucun fichier passent au Worker (ex. /p/...).
[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

# Échecs en ligne : une partie = un Durable Object (stockage SQLite, offert sur le plan gratuit).
[[durable_objects.bindings]]
name = "CHESS"
class_name = "ChessRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "ChessLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChessRoom"]

# Profils, Elo, matchmaking et classement.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChessLobby"]
